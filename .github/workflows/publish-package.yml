name: Publish inference package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Container tag, such as v0.1.0
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PACKAGE_VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build CPU inference image
        shell: bash
        run: |
          [[ "$PACKAGE_VERSION" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${PACKAGE_VERSION}"
          printf 'IMAGE=%s\n' "$image" >> "$GITHUB_ENV"
          context="$(mktemp -d)"
          git archive HEAD inference.py model.py config/config.py | tar -x -C "$context"
          cat > "$context/Dockerfile" <<'DOCKERFILE'
          FROM python:3.11-slim
          ENV PYTHONDONTWRITEBYTECODE=1 PYTHONUNBUFFERED=1
          WORKDIR /app
          RUN python -m pip install --no-cache-dir torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu \
              && python -m pip install --no-cache-dir 'transformers>=4.56,<5' 'soundfile>=0.12,<1'
          COPY inference.py model.py ./
          COPY config/config.py config/config.py
          ENTRYPOINT ["python", "inference.py"]
          DOCKERFILE
          docker build \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${PACKAGE_VERSION}" \
            --tag "$image" "$context"
      - name: Verify inference entry point and release checkpoint
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker run --rm --network none "$IMAGE" --help
          if [[ "$GITHUB_EVENT_NAME" != "release" ]]; then exit 0; fi
          checkpoint="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '[.assets[].name | select(endswith(".pth"))] | first // empty')"
          if [[ -n "$checkpoint" ]]; then
            [[ "$checkpoint" =~ ^[a-zA-Z0-9_.-]+\.pth$ ]]
            input_dir="$(mktemp -d)"
            gh release download "$GITHUB_REF_NAME" --pattern "$checkpoint" --output "$input_dir/checkpoint.pth"
            python3 - "$input_dir/smoke.wav" <<'PYTHON'
          import sys
          import wave

          with wave.open(sys.argv[1], 'wb') as audio:
              audio.setparams((1, 2, 16000, 0, 'NONE', 'not compressed'))
              audio.writeframes(b'\0\0' * 8000)
          PYTHON
            docker run --rm -e OMP_NUM_THREADS=2 -e MKL_NUM_THREADS=2 -e HF_HUB_DISABLE_XET=1 \
              --mount "type=bind,source=$input_dir,target=/input,readonly" "$IMAGE" \
              --audio /input/smoke.wav --ckpt /input/checkpoint.pth --dialect 1
          fi
      - name: Publish to GitHub Container Registry
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"
